name = "meridian-core"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENV = "production"
APP_NAME = "Meridian"

[[d1_databases]]
binding = "DB"
database_name = "meridian-db"
database_id = "REPLACE_WITH_D1_ID"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

[[r2_buckets]]
binding = "AUDIT"
bucket_name = "meridian-audit"

[[durable_objects.bindings]]
name = "TENANT"
class_name = "Tenant"

[[migrations]]
tag = "v1"
new_classes = ["Tenant"]

[triggers]
crons = ["0 2 * * *"]

[observability]
enabled = true

[ai]
binding = "AI"
